<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="SmartMind POS — multi-shop point of sale, inventory management, reporting, and offline synchronization." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/smartmind-pos-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/smartmind-pos-192.png" />

    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable !== false && (!desc.writable && !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_err) {
          // Ignore if descriptor is non-configurable
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = String((event && event.reason && (event.reason.stack || event.reason.message || event.reason)) || '');
            if (
              reason.indexOf('Cannot set property fetch') !== -1 ||
              reason.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>

    <title>SmartMind POS — Multi-Shop Point of Sale System</title>
    <meta property="og:title" content="SmartMind POS — Multi-Shop Point of Sale System" />
    <meta property="og:description" content="SmartMind POS for multi-shop sales, inventory, reporting, and offline synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.desktop.tsx"></script>
  </body>
</html>
